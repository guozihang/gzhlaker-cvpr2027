<text x="327" y="218" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172B44" text-anchor="start">Sparse correspondences</text>
<text x="327" y="256" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#536579" text-anchor="start">Sample feature indices</text>
<text x="327" y="285" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#536579" text-anchor="start">Tiled mutual Top-K</text>
<text x="327" y="314" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#536579" text-anchor="start">Retain index mapping</text>
<line x1="568" y1="247" x2="587" y2="247" stroke="#536579" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="594" y="147" width="252" height="206" rx="10" fill="#F4F7FB" stroke="#CBD5E1"/>
<circle cx="619" cy="176" r="14" fill="#16857C" stroke="none"/>
<text x="619" y="182" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="610" y="218" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172B44" text-anchor="start">Temporal proposals</text>
<text x="610" y="256" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#536579" text-anchor="start">Robust track fitting</text>
<text x="610" y="285" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#536579" text-anchor="start">Check support on both axes</text>
<text x="610" y="314" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#536579" text-anchor="start">Split unsupported gaps</text>
<line x1="851" y1="247" x2="870" y2="247" stroke="#536579" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="877" y="147" width="252" height="206" rx="10" fill="#F4F7FB" stroke="#CBD5E1"/>
<circle cx="902" cy="176" r="14" fill="#16857C" stroke="none"/>
