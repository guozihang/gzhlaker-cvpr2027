<text x="44" y="285" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#536579" text-anchor="start">ISC descriptors</text>
<text x="44" y="314" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#536579" text-anchor="start">M x d and N x d</text>
