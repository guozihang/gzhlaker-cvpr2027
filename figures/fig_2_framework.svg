<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="555" viewBox="0 0 1440 555">
<title>Proposed FastVCL framework</title>
<desc>Draft conceptual figure. No experimental measurements or model outputs.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536579"/></marker></defs>
<rect x="0" y="0" width="1440" height="555" rx="0" fill="#FFFFFF" stroke="none"/>
<text x="28" y="30" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#536579" text-anchor="start">DRAFT SCHEMATIC  /  PROPOSED DESIGN</text>
<text x="28" y="72" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#172B44" text-anchor="start">FastVCL: proposed sparse-to-tube workflow</text>
